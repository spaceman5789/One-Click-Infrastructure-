---
- name: Install docker packages
  apt:
    name:
      - docker.io
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Enable and start docker
  systemd:
    name: docker
    enabled: true
    state: started

- name: Add ubuntu user to docker group
  user:
    name: ubuntu
    groups: docker
    append: true